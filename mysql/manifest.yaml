# ===================== 1. CONFIGMAP =====================
apiVersion: v1                      # Core API version, where ConfigMaps live
kind: ConfigMap                     # Stores non-secret config as key-value pairs
metadata:                           # Identifying info
  name: mysql                       # ConfigMap name; referenced later by the StatefulSet
  namespace: roboshop               # Created in the roboshop namespace
data:                               # The actual key-value data
  MYSQL_ROOT_PASSWORD: RoboShop@1   # Root password for MySQL, injected as an env variable
---                                 # Separator: next Kubernetes object starts here
# ===================== 2. HEADLESS SERVICE =====================
apiVersion: v1                      # Core API version for Service
kind: Service                       # Creating a Service (stable network endpoint for pods)
metadata:                           # Identifying info
  name: mysql-headless              # Service name; used by the StatefulSet for pod DNS
  namespace: roboshop               # Same roboshop namespace
  labels:                           # Labels on the Service itself
    project: roboshop               # Belongs to the roboshop project
    component: mysql                # This is the mysql component
    tier: db                        # Part of the database tier
spec:                               # Desired behavior of the Service
  ports:                            # List of ports this Service exposes
  - protocol: TCP                   # Uses the TCP protocol
    port: 3306                      # Port the Service listens on (MySQL default)
    targetPort: 3306                # Port on the container where traffic is forwarded
  clusterIP: None                   # No virtual IP, so DNS returns individual pod IPs (headless)
  selector:                         # Chooses which pods this Service points to
    project: roboshop               # Pod must have project=roboshop
    component: mysql                # Pod must have component=mysql
    tier: db                        # Pod must have tier=db
---                                 # Separator for the next object
# ===================== 3. NORMAL (ClusterIP) SERVICE =====================
apiVersion: v1                      # Core API version for Service
kind: Service                       # Creating another Service
metadata:                           # Identifying info
  name: mysql                       # Name other apps use to connect (mysql:3306)
  namespace: roboshop               # Same roboshop namespace
  labels:                           # Labels on this Service
    project: roboshop               # Project label
    component: mysql                # Component label
    tier: db                        # Tier label
spec:                               # Service behavior
  ports:                            # Exposed ports
  - protocol: TCP                   # TCP protocol
    port: 3306                      # Service port clients connect to
    targetPort: 3306                # Container port traffic goes to
  selector:                         # Pods this Service load-balances across
    project: roboshop               # Match project=roboshop
    component: mysql                # Match component=mysql
    tier: db                        # Match tier=db
---                                 # Separator for the next object
# ===================== 4. STATEFULSET =====================
apiVersion: apps/v1                 # "apps" API group, where StatefulSets live
kind: StatefulSet                   # Manages stateful pods with stable names and storage
metadata:                           # Identifying info
  name: mysql                       # StatefulSet name; pods become mysql-0, mysql-1, ...
  namespace: roboshop               # Created in the roboshop namespace
  labels:                           # Labels on the StatefulSet object
    project: roboshop               # Project label
    component: mysql                # Component label
    tier: db                        # Tier label
spec:                               # Desired state of the StatefulSet
  selector:                         # How the StatefulSet finds the pods it owns
    matchLabels:                    # Pods must have all of these labels
      project: roboshop             # Match project=roboshop
      component: mysql              # Match component=mysql
      tier: db                      # Match tier=db
  serviceName: "mysql-headless"     # Headless Service giving each pod a stable DNS name
  replicas: 1                       # Run exactly 1 mysql pod (mysql-0)
  template:                         # Blueprint used to create each pod
    metadata:                       # Pod metadata
      labels:                       # Labels applied to each pod (must match the selector)
        project: roboshop           # Pod gets project=roboshop
        component: mysql            # Pod gets component=mysql
        tier: db                    # Pod gets tier=db
    spec:                           # Pod specification
      containers:                   # List of containers in the pod
      - name: mysql                 # Container name
        image: ramdocker22/mysql:4.0.0          # Custom MySQL image (with roboshop schema preloaded)
        args: ["--mysql-native-password=ON"]   # Enables the older native password auth plugin for app compatibility
        envFrom:                    # Load environment variables from a source
        - configMapRef:             # The source is a ConfigMap
            name: mysql             # Uses the "mysql" ConfigMap, so MYSQL_ROOT_PASSWORD becomes an env var
        volumeMounts:               # Volumes to mount inside the container
        - name: mysql               # Refers to the volume named "mysql" (from the PVC template)
          mountPath: /var/lib/mysql # Mounted where MySQL stores its database files
  # PVC                             # Comment: persistent volume claim section starts
  volumeClaimTemplates:             # Auto-creates a separate PVC for each pod
  - metadata:                       # PVC metadata
      name: mysql                   # PVC name (actual PVC becomes mysql-mysql-0)
    spec:                           # PVC specification
      accessModes: [ "ReadWriteOnce" ]    # Volume can be mounted read-write by one node only
      storageClassName: "roboshop-ebs"    # Uses the roboshop-ebs StorageClass (AWS EBS disk)
      resources:                    # Resource requests for the volume
        requests:                   # Minimum storage requested
          storage: 1Gi              # Asks for 1 GiB of disk space